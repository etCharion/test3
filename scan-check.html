<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <title>Kontrola dekodéru</title>
  </head>
  <body style="background: #0e1116; color: #e7ecf3; font-family: system-ui; padding: 20px">
    <h1 style="font-size: 16px">Kontrola dekódování čárových kódů</h1>
    <p id="out">běží…</p>
    <canvas id="c" style="border: 1px solid #444"></canvas>
    <script type="module">
      import { decodeCanvas } from '/src/core/scan/engine.ts';

      const L = ['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'];
      const G = ['0100111','0110011','0011011','0100001','0011101','0111001','0000101','0010001','0001001','0010111'];
      const R = ['1110010','1100110','1101100','1000010','1011100','1001110','1010000','1000100','1001000','1110100'];
      const PARITY = ['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];

      /** Vykreslí EAN-13. inverted = bílé pruhy na černém podkladu. */
      function drawEan13(canvas, isbn13, inverted) {
        const digits = isbn13.split('').map(Number);
        const first = digits[0];
        let bits = '101';
        for (let i = 0; i < 6; i++) {
          const d = digits[i + 1];
          bits += PARITY[first][i] === 'L' ? L[d] : G[d];
        }
        bits += '01010';
        for (let i = 7; i < 13; i++) bits += R[digits[i]];
        bits += '101';

        const scale = 4;
        const margin = 24;
        const height = 150;
        canvas.width = bits.length * scale + margin * 2;
        canvas.height = height + margin * 2;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = inverted ? '#000' : '#fff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = inverted ? '#fff' : '#000';
        for (let i = 0; i < bits.length; i++) {
          if (bits[i] !== '1') continue;
          const isGuard = i < 3 || (i >= 45 && i < 50) || i >= bits.length - 3;
          const h = isGuard ? height : height - 12;
          ctx.fillRect(margin + i * scale, margin, scale, h);
        }
        return canvas;
      }

      window.__check = async (isbn13) => {
        const results = [];
        for (const inverted of [false, true]) {
          const canvas = document.createElement('canvas');
          drawEan13(canvas, isbn13, inverted);
          const t0 = performance.now();
          const decoded = await decodeCanvas(canvas);
          results.push({
            inverted,
            ms: Math.round(performance.now() - t0),
            text: decoded?.text ?? null,
            engine: decoded?.engine ?? null,
            invertedHit: decoded?.inverted ?? null,
            ok: decoded?.text === isbn13,
          });
        }
        return results;
      };

      window.__checkInvertedOnly = async (isbn13) => {
        // Jen inverzní varianta: ověří, že se uplatní převrácení obrazu.
        const canvas = document.createElement('canvas');
        drawEan13(canvas, isbn13, true);
        const decoded = await decodeCanvas(canvas);
        return { text: decoded?.text ?? null, inverted: decoded?.inverted ?? null };
      };

      document.getElementById('out').textContent = 'připraveno';
    </script>
  </body>
</html>
